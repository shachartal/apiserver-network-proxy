# Single-replica Deployment so the pod is recreated if deleted (e.g.
# preempted on Autopilot). Recreate: avoid overlapping scheduler pods.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-scheduler
  namespace: overlay-system
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      component: kube-scheduler
  template:
    metadata:
      labels:
        component: kube-scheduler
    spec:
      containers:
        - name: kube-scheduler
          image: registry.k8s.io/kube-scheduler:v1.30.0
          command:
            - kube-scheduler
            - --kubeconfig=/etc/kubernetes/scheduler.kubeconfig
            - --v=2
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: kubeconfig
              mountPath: /etc/kubernetes
              readOnly: true
      volumes:
        - name: kubeconfig
          secret:
            secretName: overlay-kubeconfigs
            items:
              - key: scheduler.kubeconfig
                path: scheduler.kubeconfig
