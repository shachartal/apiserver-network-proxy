# kube-apiserver + bucket-proxy-server sidecar as a single-replica Deployment,
# so the pod is recreated if deleted (e.g. preempted on Autopilot).
#
# strategy: Recreate — never run two pods at once: both sidecars would use the
# same --server-id and poll the same bucket prefix.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-apiserver
  namespace: overlay-system
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      component: kube-apiserver
  template:
    metadata:
      labels:
        component: kube-apiserver
    spec:
      containers:
        # --- kube-apiserver ---
        - name: kube-apiserver
          image: registry.k8s.io/kube-apiserver:v1.30.0
          command:
            - kube-apiserver
            - --etcd-servers=http://etcd.overlay-system.svc:2379
            - --tls-cert-file=/pki/apiserver.crt
            - --tls-private-key-file=/pki/apiserver.key
            - --client-ca-file=/pki/ca.crt
            - --service-account-key-file=/pki/sa.pub
            - --service-account-signing-key-file=/pki/sa.key
            - --service-account-issuer=https://kubernetes.default.svc
            - --kubelet-client-certificate=/pki/apiserver-kubelet-client.crt
            - --kubelet-client-key=/pki/apiserver-kubelet-client.key
            - --authorization-mode=Node,RBAC
            - --allow-privileged=true
            - --service-cluster-ip-range=10.96.0.0/12
            - --egress-selector-config-file=/etc/kubernetes/egress-selector/egress-selector-configuration.yaml
            - --v=2
          ports:
            - containerPort: 6443
              name: https
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
          volumeMounts:
            - name: pki
              mountPath: /pki
              readOnly: true
            - name: egress-selector
              mountPath: /etc/kubernetes/egress-selector
              readOnly: true
            - name: konnectivity-uds
              mountPath: /run/konnectivity
          readinessProbe:
            httpGet:
              path: /readyz
              port: 6443
              scheme: HTTPS
            initialDelaySeconds: 10
            periodSeconds: 5

        # --- bucket-proxy-server (sidecar) ---
        - name: bucket-proxy-server
          image: bucket-proxy-server:dev
          command:
            - /bucket-proxy-server
            - --store-type=gcs
            - --gcs-bucket=GCS_BUCKET_PLACEHOLDER
            - --gcs-prefix=GCS_PREFIX_PLACEHOLDER
            # Lines marked "k3d-only" are stripped on UNDERLAY=gke, where the
            # sidecar uses Workload Identity (ADC) instead of a credentials file.
            - --gcs-credentials-file=/gcs/application_default_credentials.json # k3d-only
            - --uds-name=/run/konnectivity/konnectivity.socket
            - --server-id=bucket-server-0
            - --health-port=8092
            - --admin-port=8095
            - --nagle-delay=50ms
            - --reverse-proxy-target=localhost:6443
            - --v=4
          ports:
            - containerPort: 8092
              name: health
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: konnectivity-uds
              mountPath: /run/konnectivity
            - name: gcs-credentials # k3d-only
              mountPath: /gcs # k3d-only
              readOnly: true # k3d-only
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8092
            initialDelaySeconds: 5
            periodSeconds: 5

      volumes:
        - name: pki
          secret:
            secretName: overlay-pki
        - name: egress-selector
          configMap:
            name: egress-selector-config
        - name: konnectivity-uds
          emptyDir: {}
        - name: gcs-credentials # k3d-only
          secret: # k3d-only
            secretName: gcs-credentials # k3d-only
---
apiVersion: v1
kind: Service
metadata:
  name: kube-apiserver
  namespace: overlay-system
spec:
  type: NodePort
  selector:
    component: kube-apiserver
  ports:
    - port: 6443
      targetPort: 6443
      nodePort: 30443
